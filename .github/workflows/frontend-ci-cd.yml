name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"

jobs:
  test-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run tests
        working-directory: frontend
        run: npm test -- --watchAll=false

      - name: Build
        working-directory: frontend
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider
          npm run build


  push-docker:
    name: Push Docker images
    needs: test-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build images
        run: |
          docker build \
            -t ${{ vars.DOCKERHUB_USERNAME }}/frontend:latest \
            -t ${{ vars.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }} \
            ./frontend

      - name: Push latest image
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Push sha image
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}
