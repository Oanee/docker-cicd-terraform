name: Backend CI/CD

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_run:
    workflows: ["Infrastructure CI/CD"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Run tests
        working-directory: backend
        run: npm test

  push-docker:
    name: Push Docker images
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        run: |
          SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/backend:latest -t ${{ vars.DOCKERHUB_USERNAME }}/backend:$SHA ./backend
          docker push ${{ vars.DOCKERHUB_USERNAME }}/backend:latest
          docker push ${{ vars.DOCKERHUB_USERNAME }}/backend:$SHA

  deploy:
    name: Deploy to AWS
    needs: push-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.3

      - name: Fetch ECS Details and Deploy
        run: |
          cd terraform-infrastructure
          terraform init
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          SERVICE=$(terraform output -raw ecs_service_name)
          aws ecs update-service --cluster $CLUSTER --service $SERVICE --force-new-deployment
