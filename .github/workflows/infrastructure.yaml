name: Infrastructure CI/CD

on:
  push:
    branches: [main]
    paths: ["terraform-infrastructure/**"]
  pull_request:
    branches: [main]
    paths: ["terraform-infrastructure/**"]
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action'
        required: true
        default: 'apply'
        type: choice
        options: [apply, destroy]

env:
  TF_VAR_backend_port: ${{ vars.BACKEND_PORT }}
  TF_VAR_mongo_db_name: ${{ vars.MONGO_DB_NAME }}
  TF_VAR_node_env: ${{ vars.NODE_ENV }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_mongo_org_id: ${{ vars.MONGO_ORG_ID }}
  TF_VAR_mongo_username: ${{ vars.MONGO_USERNAME }}
  TF_VAR_frontend_bucket: ${{ vars.FRONTEND_BUCKET }}
  TF_VAR_mongo_public_key: ${{ secrets.MONGO_PUBLIC_KEY }}
  TF_VAR_mongo_private_key: ${{ secrets.MONGO_PRIVATE_KEY }}
  TF_VAR_mongo_password: ${{ secrets.MONGO_PASSWORD }}
  TF_VAR_secret_jwt_key: ${{ secrets.SECRET_JWT_KEY }}

concurrency:
  group: tf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform-infrastructure
    outputs:
      plan_exists: ${{ steps.plan.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.3
      - run: terraform init
      - id: plan
        name: Generate Plan
        run: |
          ACTION=${{ github.event.inputs.action || 'apply' }}
          if [ "$ACTION" == "destroy" ]; then
            terraform plan -destroy -input=false -out=tfplan
          else
            terraform plan -input=false -out=tfplan
          fi
      - name: Upload Plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: terraform-infrastructure/tfplan

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.terraform-plan.outputs.plan_exists == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform-infrastructure
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: terraform-infrastructure/
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.3
      - run: terraform init
      - run: terraform apply -input=false tfplan
