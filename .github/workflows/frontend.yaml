name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_run:
    workflows: ["Infrastructure CI/CD"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 18

      - working-directory: frontend
        run: npm install

      - working-directory: frontend
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/build/

  push-docker:
    name: Push Docker images
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: |
          SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/frontend:latest -t ${{ vars.DOCKERHUB_USERNAME }}/frontend:$SHA ./frontend
          docker push ${{ vars.DOCKERHUB_USERNAME }}/frontend:latest
          docker push ${{ vars.DOCKERHUB_USERNAME }}/frontend:$SHA

  deploy:
    name: Deploy to AWS
    needs: push-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.3

      - uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend/build/

      - run: |
          cd terraform-infrastructure
          terraform init
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          aws s3 sync ../frontend/build/ s3://${{ vars.FRONTEND_BUCKET }}/ --delete
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
